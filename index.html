<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Fylo data storage component</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="card">
        <img src="./images/logo.svg" alt="" />
        <img src="./images/icon-document.svg" alt="" />
        <img src="./images/icon-folder.svg" alt="" />
        <img src="./images/icon-upload.svg" alt="" />
      </div>
      <div class="storage">
        <p>You’ve used 815 GB of your storage</p>
        <div class="bar"></div>
        <div class="bar-labels">0 GB 1000 GB</div>
        <div class="storage-left">185 GB Left</div>
      </div>
    </main>
    <footer class="attribution">
      <p>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
        >.
      </p>
      <p>Coded by <a href="#">Ziad Mohamed</a>.</p>
    </footer>
  </body>
</html>
